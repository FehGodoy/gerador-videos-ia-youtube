name: Render video

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Slug do job (pasta output/<slug>/ dentro do zip)"
        required: true
        type: string
      release_tag:
        description: "Tag da Release temporária com o zip (composition.json + mídia)"
        required: true
        type: string

run-name: render-${{ inputs.slug }}

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências do Remotion
        working-directory: remotion
        run: npm ci

      - name: Baixar e descompactar mídia da release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/render_input /tmp/staging
          gh release download "${{ inputs.release_tag }}" --pattern render_input.zip --dir /tmp/render_input --repo "${{ github.repository }}"
          unzip -q /tmp/render_input/render_input.zip -d /tmp/staging

      - name: Renderizar
        working-directory: remotion
        env:
          REMOTION_PUBLIC_DIR: /tmp/staging
        run: npx remotion render src/index.ts VideoComposition ../video.mp4 --props=/tmp/staging/output/${{ inputs.slug }}/composition.json

      - name: Upload do vídeo renderizado
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: video.mp4
          retention-days: 1
