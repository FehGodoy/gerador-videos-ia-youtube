# Configuração do pipeline de vídeo (Fase 1).
# Chaves de API ficam no .env, nunca aqui.

video:
  fps: 30
  width: 1920
  height: 1080

narration:
  provider: cartesia
  voice_id: "" # preencha com o ID da voz escolhida no dashboard da Cartesia (play.cartesia.ai)
  model_id: "sonic-3"
  language: "pt"
  sample_rate: 44100
  silence_between_beats_ms: 350 # pausa inserida entre beats na concatenação
  cartesia_api_version: "2026-03-01"
  speed: 1.0 # 0.6 (mais lento) a 1.5 (mais rápido); painel web deixa ajustar por rascunho

keywords:
  provider: anthropic # anthropic | openai
  model: "claude-haiku-4-5-20251001"
  terms_per_beat: 3 # 2-4 termos de busca visual por beat

footage:
  sources: [pexels, pixabay]
  min_duration_seconds: 3
  candidates_per_beat: 5 # quantos candidatos avaliar antes de escolher
  orientation: "landscape"
  # Um bloco de narração vira várias cenas na tela. Sem isso, um bloco de 3min
  # ficava com um clipe só, que acabava aos 30s e congelava no último frame.
  scene_seconds: 7 # duração alvo de cada corte
  seconds_per_shot: 25 # a cada ~25s de narração, mais uma ideia visual distinta
  max_shots_per_beat: 8 # teto de clipes distintos baixados por bloco
  chart_scene_seconds: 6 # quanto tempo o gráfico ocupa a tela num bloco estatístico

highlights:
  # Selos de informação sobrepostos ao footage, posicionados no segundo exato
  # em que o dado é falado (via timestamps por palavra da Cartesia).
  seconds_per_highlight: 25 # a cada ~25s de narração, mais um selo
  max_per_beat: 12
  duration_seconds: 4.5 # quanto tempo cada selo fica na tela
  min_gap_seconds: 3.0 # espaço mínimo entre o fim de um selo e o início do próximo

paths:
  cache_dir: "cache"
  output_dir: "output"
  scripts_input_dir: "scripts_input"
  fallback_footage: "assets/fallback"
  music_dir: "assets/music"

remotion:
  project_dir: "remotion"
  composition_id: "VideoComposition"
