# Configuração do pipeline de vídeo (Fase 1).
# Chaves de API ficam no .env, nunca aqui.

video:
  fps: 30
  width: 1920
  height: 1080

narration:
  provider: cartesia
  voice_id: "" # preencha com o ID da voz escolhida no dashboard da Cartesia (play.cartesia.ai)
  model_id: "sonic-3"
  language: "pt"
  sample_rate: 44100
  silence_between_beats_ms: 350 # pausa inserida entre beats na concatenação
  cartesia_api_version: "2026-03-01"
  speed: 1.0 # 0.6 (mais lento) a 1.5 (mais rápido); painel web deixa ajustar por rascunho

keywords:
  provider: anthropic # anthropic | openai
  model: "claude-haiku-4-5-20251001"
  terms_per_beat: 3 # 2-4 termos de busca visual por beat

footage:
  # wikimedia é foto e cobre o que stock genérico não tem: modelo de carro,
  # evento histórico, pessoa pública, lugar nomeado. Exige crédito (CC BY/BY-SA)
  # — a atribuição vai junto no composition.json.
  sources: [pexels, pixabay, wikimedia, nasa, youtube, google_images]
  # Qual acervo faz sentido pra cada decisão do diretor visual (vídeo de stock
  # genérico não busca em fonte de foto, cena documental não busca em Pexels).
  # A ORDEM aqui não importa pro código — dentro de cada grupo, a busca segue
  # a hierarquia global SOURCE_PRIORITY (footage_search.py): google_images,
  # youtube, wikimedia, pexels, pixabay, nasa. É "waterfall": para na primeira
  # fonte que achar QUALQUER resultado, não consulta as seguintes daquele
  # termo — decisão do usuário pra economizar crédito do Serper (google_images
  # é sempre a primeira tentada). Fonte fora de `sources` é ignorada aqui.
  strategy_sources:
    FOOTAGE: [pexels, pixabay, youtube] # cena filmável genérica: vídeo de stock
    NEWS: [wikimedia, nasa, youtube, google_images] # fato/pessoa/objeto real: acervo documental + foto de imprensa
    # google_images cobre o que nem Wikimedia nem Pexels têm (imagem editorial
    # de site de notícia, produto específico, pessoa específica), mas sem
    # filtro de licença nenhum — ver aviso em _search_google_images. Por ser
    # 1º na hierarquia, é chamado sempre que a estratégia é IMAGE.
    IMAGE: [wikimedia, nasa, pexels, google_images] # foto comunica melhor
    MOTION_GRAPHIC: [pexels, pixabay] # só o fundo do gráfico
  youtube:
    # A cota do Data API v3 é de 10.000 unidades/dia por projeto e cada busca
    # custa 100. As chaves GOOGLE_API_KEY_1/2/3 são de contas diferentes e o
    # código gira pra próxima quando uma estoura.
    creative_commons_only: true # filtra videoLicense=creativeCommon na busca
    prefer_hd: true # filtro da BUSCA (videoDefinition=high); não muda o download
    # Teto de altura do DOWNLOAD. Exige cookies de uma sessão logada num dos
    # navegadores da máquina (chrome/edge/firefox/brave/opera/vivaldi) — sem
    # login o YouTube trava em 360p mesmo listando formatos maiores. Se nenhum
    # navegador tiver cookies utilizáveis (banco travado com o app aberto),
    # cai para 360p e segue sem travar o pipeline.
    max_height: 1080
    clip_seconds: 20 # quanto de cada vídeo baixar
    start_offset_seconds: 10 # pula a vinheta de abertura
    max_source_duration_seconds: 1800 # ignora vídeo muito longo (live, palestra inteira)
  google_images:
    # Restringe a busca a resultados recentes (mesmo filtro "ferramentas" do
    # Google: qualquer hora/dia/semana/mês/ano). Ajuda MUITO em conteúdo de
    # notícia/atualidade (evita foto antiga sem relação com o fato recente).
    # Valores: null (sem filtro, padrão), "day", "week", "month", "year".
    # Desligue (null) se o roteiro for sobre assunto histórico — o filtro
    # tiraria justamente a foto de arquivo antiga que faria sentido ali.
    recency: null
  # Piso de largura do ARQUIVO baixado de verdade (não a largura declarada
  # pela fonte antes do download, que pode estar errada — caso real de
  # google_images, sem controle sobre o metadado do site de terceiro). Ver
  # _validate_downloaded_media em modules/footage_search.py. Mais baixo que
  # WIKIMEDIA_MIN_WIDTH/SERPER_MIN_WIDTH (1280, aplicados na escolha do
  # candidato) de propósito: aqui é só uma rede de segurança contra imagem
  # minúscula/quebrada, não o filtro de qualidade em si.
  min_downloaded_width: 640
  # Clipe curto rende poucos trechos distintos quando reaproveitado; a partir
  # de ~8s dá pra mostrar um pedaço diferente a cada reuso.
  min_duration_seconds: 8
  candidates_per_beat: 5 # quantos candidatos avaliar antes de escolher
  orientation: "landscape"
  # Um bloco de narração vira várias cenas na tela. Sem isso, um bloco de 3min
  # ficava com um clipe só, que acabava aos 30s e congelava no último frame.
  scene_seconds: 7 # duração alvo de cada corte
  # Estes dois controlam a REPETIÇÃO. Quanto mais shots, menos vezes cada clipe
  # reaparece — em troca de mais buscas, mais chamadas de ranking por visão e
  # um pacote maior pra subir no render remoto (que já é a etapa mais lenta).
  # Com 15/14: ~50 clipes distintos num vídeo de 12min, cada um ~2,4x.
  seconds_per_shot: 15 # a cada ~15s de narração, mais uma ideia visual distinta
  max_shots_per_beat: 14 # teto de clipes distintos baixados por bloco
  chart_scene_seconds: 6 # quanto tempo o gráfico ocupa a tela num bloco estatístico

ranking:
  # Nota 0-100 que a IA de visão dá a cada candidato (ver modules/footage_ranker).
  # O princípio: material que só lembra o assunto é pior que assumir que não
  # achamos nada — abaixo do mínimo o shot vira card conceitual em vez de
  # footage genérico.
  # >= isso: a busca para de tentar mais fontes (achou algo bom o bastante).
  # Antes esse "para de buscar" usava o mesmo valor do piso de baixo
  # (60) — parava a primeira fonte que trouxesse algo só "razoável",
  # sem chegar a tentar uma fonte melhor. Esse campo existia no config.yaml
  # sem nenhum código ler ele (conferido: zero referência em modules/ ou
  # webapp/) até esta mudança religar ele de verdade.
  auto_accept_threshold: 80
  alternative_threshold: 60 # piso de revisão: abaixo disso a mídia é descartada e cai no card conceitual, nunca publica

highlights:
  # Selos de informação sobrepostos ao footage, posicionados no segundo exato
  # em que o dado é falado (via timestamps por palavra da Cartesia).
  seconds_per_highlight: 25 # a cada ~25s de narração, mais um selo
  max_per_beat: 12
  duration_seconds: 4.5 # quanto tempo cada selo fica na tela
  min_gap_seconds: 3.0 # espaço mínimo entre o fim de um selo e o início do próximo

paths:
  cache_dir: "cache"
  output_dir: "output"
  scripts_input_dir: "scripts_input"
  fallback_footage: "assets/fallback"
  music_dir: "assets/music"

remotion:
  project_dir: "remotion"
  composition_id: "VideoComposition"
